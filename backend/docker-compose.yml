services:
  platformd:
    image: platformd:dev # need to implement this
    # environment:
    expose:
      - 8080
    ports:
      - "8080:8080"
    volumes:
     - ./:/app
    depends_on:
      - redis
      - mongodb
    # container-name: platformd
    networks:
      - default
    labels:
      - service=platformd

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - default
    labels:
      - service=redis
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - default
    labels:
      - service=mongodb
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb

volumes:
  redis-data: 